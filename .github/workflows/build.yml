# GitHub Actions 构建工作流
#
# 触发条件：
#   1. 推送版本标签时自动构建（git tag v1.0.0 && git push --tags）
#   2. 手动触发（GitHub 页面点击 "Run workflow"）
#
# 构建产物直接发布到 GitHub Release

name: Build

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: '版本号（留空自动从标签读取）'
        required: false
        type: string

env:
  PYTHON_VERSION: '3.12'

permissions:
  contents: write

jobs:
  macos-arm64:
    name: macOS ARM64
    runs-on: macos-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: 设置 Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: '**/requirements.txt'

      - name: 安装 ccache
        run: brew install ccache

      - name: 安装 Python 依赖
        run: |
          python3 -m pip install --upgrade pip wheel setuptools
          pip install nuitka
          pip install -r requirements.txt

      - name: 下载模型文件
        run: |
          bash download_model.sh
          echo "模型文件:"
          find models -type f \( -name "*.onnx" -o -name "*.txt" \) | sort

      - name: Nuitka 编译
        run: |
          VERSION="${{ github.event.inputs.version }}"
          if [ -z "$VERSION" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          if ! echo "$VERSION" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+'; then
            VERSION="1.8.6"
          fi
          echo "VERSION=$VERSION" >> $GITHUB_ENV

          python3 -m nuitka \
            --standalone \
            --enable-plugin=tk-inter \
            --nofollow-import-to=tkinterdnd2 \
            --include-module=av \
            --follow-import-to=av \
            --include-module=corrector \
            --include-module=tokenizers \
            --include-data-files=models/silero_vad.onnx=models/silero_vad.onnx \
            --include-data-files=models/3dspeaker_speech_campplus_sv_zh_en_16k-common_advanced.onnx=models/3dspeaker_speech_campplus_sv_zh_en_16k-common_advanced.onnx \
            --include-data-files=models/sherpa-onnx-sense-voice-zh-en-ja-ko-yue-int8-2024-07-17/model.int8.onnx=models/sherpa-onnx-sense-voice-zh-en-ja-ko-yue-int8-2024-07-17/model.int8.onnx \
            --include-data-files=models/sherpa-onnx-sense-voice-zh-en-ja-ko-yue-int8-2024-07-17/tokens.txt=models/sherpa-onnx-sense-voice-zh-en-ja-ko-yue-int8-2024-07-17/tokens.txt \
            --include-data-files=models/sherpa-onnx-pyannote-segmentation-3-0/model.int8.onnx=models/sherpa-onnx-pyannote-segmentation-3-0/model.int8.onnx \
            --include-data-files=models/corrector/model.onnx=models/corrector/model.onnx \
            --include-data-files=models/corrector/tokenizer.json=models/corrector/tokenizer.json \
            --include-data-files=models/corrector/vocab.txt=models/corrector/vocab.txt \
            --include-data-dir=icons=icons \
            --output-dir=dist \
            --output-filename="音频转文字" \
            --company-name="ASR" \
            --product-name="音频转文字" \
            --file-description="音频转文字工具" \
            --file-version="${VERSION}" \
            --product-version="${VERSION}" \
            --macos-create-app-bundle \
            --macos-app-name="音频转文字" \
            --macos-app-version="${VERSION}" \
            --macos-app-icon=icons/icon.icns \
            --static-libpython=no \
            --assume-yes-for-downloads \
            --show-progress \
            --show-memory \
            gui.py

      - name: 压缩产物
        run: |
          VERSION="${{ env.VERSION }}"
          mv dist/gui.app "dist/音频转文字-macOS-ARM64-${VERSION}.app"
          cd dist
          zip -ry "音频转文字-macOS-ARM64-${VERSION}.zip" "音频转文字-macOS-ARM64-${VERSION}.app"

      - name: 上传到 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          name: v${{ env.VERSION }}
          body: |
            音频转文字 v${{ env.VERSION }}

            ## 下载
            - **macOS ARM64**: `音频转文字-macOS-ARM64-${{ env.VERSION }}.zip`
            - **Windows x86_64**: `音频转文字-Windows-${{ env.VERSION }}.zip`

            ## 使用说明
            1. 下载对应平台的压缩包
            2. macOS: 解压后双击 .app 运行，首次可能需要在"系统设置 > 隐私与安全性"中允许
            3. Windows: 解压后运行 `音频转文字.exe`
          files: dist/*.zip
          draft: false
          prerelease: false

  windows:
    name: Windows x86_64
    runs-on: windows-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: 设置 Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: '**/requirements.txt'

      - name: 安装 Python 依赖
        shell: pwsh
        run: |
          python -m pip install --upgrade pip wheel setuptools
          pip install nuitka
          pip install -r requirements.txt

      - name: 下载模型文件
        shell: pwsh
        run: |
          if (Get-Command "bash" -ErrorAction SilentlyContinue) {
            bash download_model.sh
          } else {
            python tools/download_models.py
          }
          Get-ChildItem -Recurse -Path models -Include *.onnx, *.txt | Select-Object Name | Format-Table

      - name: Nuitka 编译
        shell: pwsh
        env:
          NUITKA_CACHE_DIR: ${{ runner.temp }}/nuitka-cache
        run: |
          $version = "${{ github.event.inputs.version }}"
          if (-not $version) { $version = "$env:GITHUB_REF_NAME".TrimStart("v") }
          if ($version -notmatch '^\d+\.\d+\.\d+') { $version = "1.8.6" }
          echo "VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append

          python -m nuitka `
            --standalone `
            --enable-plugin=tk-inter `
            --nofollow-import-to=tkinterdnd2 `
            --include-module=av `
            --follow-import-to=av `
            --include-module=corrector `
            --include-module=tokenizers `
            --include-data-files=models/silero_vad.onnx=models/silero_vad.onnx `
            --include-data-files=models/3dspeaker_speech_campplus_sv_zh_en_16k-common_advanced.onnx=models/3dspeaker_speech_campplus_sv_zh_en_16k-common_advanced.onnx `
            --include-data-files=models/sherpa-onnx-sense-voice-zh-en-ja-ko-yue-int8-2024-07-17/model.int8.onnx=models/sherpa-onnx-sense-voice-zh-en-ja-ko-yue-int8-2024-07-17/model.int8.onnx `
            --include-data-files=models/sherpa-onnx-sense-voice-zh-en-ja-ko-yue-int8-2024-07-17/tokens.txt=models/sherpa-onnx-sense-voice-zh-en-ja-ko-yue-int8-2024-07-17/tokens.txt `
            --include-data-files=models/sherpa-onnx-pyannote-segmentation-3-0/model.int8.onnx=models/sherpa-onnx-pyannote-segmentation-3-0/model.int8.onnx `
            --include-data-files=models/corrector/model.onnx=models/corrector/model.onnx `
            --include-data-files=models/corrector/tokenizer.json=models/corrector/tokenizer.json `
            --include-data-files=models/corrector/vocab.txt=models/corrector/vocab.txt `
            --include-data-dir=icons=icons `
            --output-dir=dist `
            --output-filename="音频转文字.exe" `
            --company-name="ASR" `
            --product-name="音频转文字" `
            --file-description="音频转文字工具" `
            --file-version=$version `
            --product-version=$version `
            --windows-disable-console `
            --windows-icon-from-ico=icons/icon.ico `
            --assume-yes-for-downloads `
            --show-progress `
            --show-memory `
            gui.py

      - name: 压缩产物
        shell: pwsh
        run: |
          $version = "$env:VERSION"
          $src = "dist\gui.dist"
          $dst = "dist\音频转文字-Windows-${version}"
          if (Test-Path $src) {
            Move-Item -Path $src -Destination $dst
            Compress-Archive -Path $dst -DestinationPath "dist\音频转文字-Windows-${version}.zip"
          }

      - name: 上传到 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          name: v${{ env.VERSION }}
          body: |
            音频转文字 v${{ env.VERSION }}

            ## 下载
            - **macOS ARM64**: `音频转文字-macOS-ARM64-${{ env.VERSION }}.zip`
            - **Windows x86_64**: `音频转文字-Windows-${{ env.VERSION }}.zip`

            ## 使用说明
            1. 下载对应平台的压缩包
            2. macOS: 解压后双击 .app 运行，首次可能需要在"系统设置 > 隐私与安全性"中允许
            3. Windows: 解压后运行 `音频转文字.exe`
          files: dist/*.zip
          draft: false
          prerelease: false